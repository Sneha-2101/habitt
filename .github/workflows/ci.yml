name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    env:
      DATABASE_URL: "postgresql://u:p@127.0.0.1:1/x"
      DIRECT_URL: "postgresql://u:p@127.0.0.1:1/x"
      AUTH_SECRET: "ci_dummy_auth_secret_for_static_build_and_unit_tests_32"
      NEXTAUTH_SECRET: "ci_dummy_nextauth_secret_for_static_build_and_unit_tests"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "dummy-supabase-publishable-key"
      SUPABASE_URL: "https://dummy.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-supabase-service-role-key"
      NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_dummykey12345"
      RAZORPAY_KEY_ID: "rzp_test_dummykey12345"
      RAZORPAY_KEY_SECRET: "dummy_razorpay_secret_12345"
      RAZORPAY_WEBHOOK_SECRET: "dummy_webhook_secret_12345"
      CRON_SECRET: "dummy_cron_secret_12345"
      OTP_PEPPER: "dummy_otp_pepper_for_ci_testing_purposes"
      RESEND_API_KEY: "disabled"
      RESEND_FROM_EMAIL: "support@example.com"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      UPSTASH_REDIS_REST_URL: "https://dummy.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "dummy_token"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
